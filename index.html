
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BOR — Wine Journal</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>

<body>

    <main>

        <div class="language" aria-label="Language / Nyelv">

            <button type="button"
                    data-lang="en"
                    aria-pressed="true">
                EN
            </button>

            <button type="button"
                    data-lang="hu"
                    aria-pressed="false">
                HU
            </button>

        </div>

        <div class="grape-header"></div>

        <section class="hero" id="top">

            <p class="eyebrow"
               data-en="A PERSONAL WINE JOURNAL"
               data-hu="SZEMÉLYES BORNAPLÓ">
            </p>

            <h1>B O R</h1>

            <p class="subtitle"
               data-en="Every bottle has a story."
               data-hu="Minden palacknak története van.">
            </p>

            <a class="button"
               href="#bottle"
               data-en="Begin tasting ↓"
               data-hu="Kóstolás kezdése ↓">
            </a>

        </section>

        <!-- WINE TASTING FORM -->

        <form id="journal" novalidate>

            <!-- Tasting sections generated by JavaScript -->

            <div id="sections"></div>

            <!-- SAVE AND EMAIL -->

            <section id="save">

                <div class="panel final">

                    <p class="eyebrow"
                       data-en="07 / THE COLLECTION"
                       data-hu="07 / A GYŰJTEMÉNY">
                    </p>

                    <h2
                        data-en="Preserve the memory."
                        data-hu="Őrizd meg az emléket.">
                    </h2>

                    <label for="recipientEmail"
                           data-en="Recipient email (optional)"
                           data-hu="Címzett e-mail-címe (nem kötelező)">
                    </label>

                    <input
                        type="email"
                        id="recipientEmail"
                        autocomplete="email"
                        placeholder="example@gmail.com"
                    >

                    <button
                        type="submit"
                        class="button"
                        data-en="Save PDF"
                        data-hu="PDF mentése">
                    </button>

                    <button
                        type="button"
                        class="button secondary"
                        id="email"
                        data-en="Email PDF"
                        data-hu="PDF küldése e-mailben">
                    </button>

                    <p id="status"
                       role="status"
                       class="muted">
                    </p>

                </div>

            </section>

        </form>

    </main>

    <footer
        data-en="BOR · Personal wine journal"
        data-hu="BOR · Személyes bornapló">
    </footer>

    <!-- Printable tasting record -->

    <article id="printRecord"></article>

    <script src="script.js"></script>

</body>

</html>
